name: Quality gates

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      DJANGO_DEBUG: "1"
      DJANGO_TIME_ZONE: UTC

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m pip check
          npm ci

      - name: Verify generated CSS
        run: |
          npm run build:css
          git diff --exit-code -- static/css/app.css

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Static quality checks
        run: |
          ruff format --check .
          ruff check .
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Deployment security check
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-long-random-secret-key-8f1c35a264ef4dbca38ab6de
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_HSTS_INCLUDE_SUBDOMAINS: "1"
          DJANGO_HSTS_PRELOAD: "1"
        run: python manage.py check --deploy --fail-level WARNING

      - name: Test
        env:
          APP_LOG_LEVEL: CRITICAL
          DJANGO_REQUEST_LOG_LEVEL: CRITICAL
        run: python manage.py test --noinput

  # A Dockerfile that is never built is a Dockerfile that does not work. This
  # builds it and then proves the result actually serves traffic, because a
  # successful build still tells you nothing about whether the thing starts.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wams:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot it and check the liveness probe
        env:
          # No database is reachable here on purpose: liveness must not depend
          # on one. /readyz is the endpoint that is allowed to care.
          DJANGO_SECRET_KEY: ci-only-long-random-secret-key-8f1c35a264ef4dbca38ab6de
          DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
        run: |
          docker run -d --name wams-ci -p 8000:8000 \
            -e DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" \
            -e DJANGO_ALLOWED_HOSTS="$DJANGO_ALLOWED_HOSTS" \
            -e DJANGO_SECURE_SSL_REDIRECT=0 \
            wams:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz/ >/dev/null 2>&1; then
              echo "liveness probe answered after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::The container never answered /healthz/"
          docker logs wams-ci
          exit 1

      - name: Container logs
        if: always()
        run: docker logs wams-ci 2>&1 | tail -50 || true
